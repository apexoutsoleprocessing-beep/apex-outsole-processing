<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>apex-outsole-processing</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
}

header {
  background: #123456;
  color: white;
  padding: 22px 15px;
  text-align: center;
}

header h1 {
  margin: 0 0 15px;
  font-size: 26px;
  overflow-wrap: anywhere;
}

button {
  padding: 11px 16px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
  margin: 4px;
}

.primary { background: #0875cf; color: white; }
.secondary { background: #dbeafe; color: #123456; }
.delete { background: #dc2626; color: white; }

main {
  max-width: 1100px;
  margin: 20px auto;
  padding: 0 12px;
}

.panel {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px #0000000c;
}

.hidden { display: none; }

label {
  display: block;
  margin: 13px 0 6px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccd5df;
  border-radius: 7px;
  font: inherit;
}

.preview {
  display: none;
  max-width: 200px;
  max-height: 180px;
  margin-top: 10px;
  object-fit: contain;
}

.search { margin-bottom: 18px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 16px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 3px 12px #00000012;
}

.card img {
  width: 100%;
  height: 210px;
  object-fit: contain;
  background: #e8edf3;
}

.card-body { padding: 15px; }
.card h2 { margin-top: 0; overflow-wrap: anywhere; }

.detail {
  padding: 9px 0;
  border-top: 1px solid #e5e7eb;
  overflow-wrap: anywhere;
}

.detail b {
  display: block;
  font-size: 12px;
  color: #64748b;
  margin-bottom: 4px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #64748b;
}
</style>
</head>

<body>

<header>
  <h1>APEX OUTSOLE PROCESSING</h1>
  <button class="secondary" id="loginBtn">Admin Login</button>
</header>

<main>

  <!-- ADMIN LOGIN -->
  <section id="loginPanel" class="panel hidden">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <label for="password">Password</label>
      <input id="password" type="password" required>
      <button class="primary" type="submit">Login</button>
      <button class="secondary" type="button"
        onclick="hideLogin()">Cancel</button>
      <p id="loginError"></p>
    </form>
  </section>

  <!-- ADMIN FORM -->
  <section id="adminPanel" class="panel hidden">
    <h2 id="formHeading">Add New Sole</h2>

    <form id="soleForm">
      <input type="hidden" id="editId">

      <label for="picture">PICTURE - Gallery থেকে ছবি বাছুন</label>
      <input type="file" id="picture" accept="image/*">
      <img id="preview" class="preview" alt="Picture preview">

      <label for="soleName">SOLE NAME</label>
      <input id="soleName" required
        placeholder="Enter sole name">

      <label for="colour">COLOUR</label>
      <input id="colour" placeholder="Enter colour">

      <label for="processing">SOLE PROCESSING</label>
      <input id="processing"
        placeholder="Enter sole processing">

      <label for="colourMix">COLOUR MIX (made)</label>
      <textarea id="colourMix" rows="3"
        placeholder="Enter colour mix details"></textarea>

      <button class="primary" type="submit">Save Item</button>
      <button class="secondary" type="button"
        onclick="resetForm()">Clear</button>
      <button class="delete" type="button"
        onclick="logout()">Logout</button>
    </form>
  </section>

  <!-- SEARCH -->
  <input class="search" id="search"
    placeholder="Search sole name or colour...">

  <!-- ITEMS SHOW HERE -->
  <section id="items" class="grid"></section>

  <p id="emptyMessage" style="text-align:center">
    কোনো আইটেম নেই। Admin Login করে নতুন ছবি যোগ করুন।
  </p>

</main>

<footer>
  © 2026 apex-outsole-processing
</footer>

<!-- FIREBASE CONNECTION ADDED -->
<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  push,
  onValue,
  get
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const app = initializeApp({
  databaseURL:
    "https://horintati-sports-club-9e801-default-rtdb.firebaseio.com"
});

const db = getDatabase(app);

window.firebaseDB = db;

window.firebaseFunctions = {
  ref,
  set,
  push,
  onValue,
  get
};

</script>

<!-- YOUR ORIGINAL JAVASCRIPT -->
<script>
const ADMIN_PASSWORD = "@#$@#$@#$";
const STORAGE_KEY = "apex_outsole_items";

let isAdmin = false;
let currentImage = "";
let items = [];

try {
  items = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (!Array.isArray(items)) items = [];
} catch {
  items = [];
}

const $ = id => document.getElementById(id);

function hideLogin() {
  $("loginPanel").classList.add("hidden");
}

$("loginBtn").onclick = () => {
  $("loginPanel").classList.remove("hidden");
};

$("loginForm").onsubmit = function(e) {
  e.preventDefault();

  if ($("password").value === ADMIN_PASSWORD) {
    isAdmin = true;
    hideLogin();
    $("adminPanel").classList.remove("hidden");
    $("loginBtn").textContent = "Admin Active";
    $("password").value = "";
    renderItems();
  } else {
    $("loginError").textContent = "Wrong password!";
  }
};

function logout() {
  isAdmin = false;
  $("adminPanel").classList.add("hidden");
  $("loginBtn").textContent = "Admin Login";
  resetForm();
  renderItems();
}

function saveItems() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    return true;
  } catch (e) {
    alert("Storage full! ছোট ছবি ব্যবহার করুন।");
    return false;
  }
}

function escapeHTML(value) {
  return String(value || "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

// Convert selected gallery picture to a smaller image.
$("picture").onchange = function() {
  const file = this.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Please choose an image.");
    return;
  }

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = function() {
    const scale = Math.min(
      1, 900 / Math.max(img.width, img.height)
    );

    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(img.width * scale));
    canvas.height = Math.max(1, Math.round(img.height * scale));

    canvas.getContext("2d").drawImage(
      img, 0, 0, canvas.width, canvas.height
    );

    currentImage = canvas.toDataURL("image/jpeg", 0.8);
    $("preview").src = currentImage;
    $("preview").style.display = "block";
    URL.revokeObjectURL(url);
  };

  img.onerror = function() {
    URL.revokeObjectURL(url);
    alert("ছবিটি খোলা যায়নি। অন্য ছবি বাছুন।");
  };

  img.src = url;
};

$("soleForm").onsubmit = function(e) {
  e.preventDefault();

  if (!isAdmin) return;

  const id = $("editId").value;
  const oldItem = items.find(item => item.id === id);

  if (!oldItem && !currentImage) {
    alert("প্রথমে একটি ছবি বাছুন।");
    return;
  }

  const item = {
    id: id || Date.now().toString(),
    image: currentImage || (oldItem ? oldItem.image : ""),
    name: $("soleName").value.trim(),
    colour: $("colour").value.trim(),
    processing: $("processing").value.trim(),
    mix: $("colourMix").value.trim()
  };

  if (oldItem) {
    items = items.map(x => x.id === id ? item : x);
  } else {
    items.unshift(item);
  }

  if (saveItems()) {
    resetForm();
    renderItems();
    alert("সফলভাবে সেভ হয়েছে!");
  }
};

function resetForm() {
  $("soleForm").reset();
  $("editId").value = "";
  currentImage = "";
  $("preview").removeAttribute("src");
  $("preview").style.display = "none";
  $("formHeading").textContent = "Add New Sole";
}

function editItem(id) {
  const item = items.find(x => x.id === id);
  if (!item) return;

  $("editId").value = item.id;
  $("soleName").value = item.name;
  $("colour").value = item.colour;
  $("processing").value = item.processing;
  $("colourMix").value = item.mix;

  currentImage = item.image;
  $("preview").src = item.image;
  $("preview").style.display = "block";
  $("formHeading").textContent = "Edit Sole";

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteItem(id) {
  const item = items.find(x => x.id === id);
  if (!item || !confirm("এই আইটেমটি মুছে ফেলবেন?")) return;

  items = items.filter(x => x.id !== id);

  if (saveItems()) renderItems();
}

function renderItems() {
  const query = $("search").value.toLowerCase().trim();

  const filtered = items.filter(item =>
    [item.name, item.colour, item.processing, item.mix]
      .some(value => String(value || "").toLowerCase().includes(query))
  );

  $("items").innerHTML = filtered.map(item => `
    <article class="card">
      <img src="${escapeHTML(item.image)}"
        alt="${escapeHTML(item.name)}">

      <div class="card-body">
        <h2>${escapeHTML(item.name)}</h2>

        <div class="detail">
          <b>COLOUR</b>${escapeHTML(item.colour || "—")}
        </div>

        <div class="detail">
          <b>SOLE PROCESSING</b>${escapeHTML(item.processing || "—")}
        </div>

        <div class="detail">
          <b>COLOUR MIX (made)</b>
          ${escapeHTML(item.mix || "—")}
        </div>

        ${isAdmin ? `
          <button class="secondary"
            data-edit="${escapeHTML(item.id)}">Edit</button>
          <button class="delete"
            data-delete="${escapeHTML(item.id)}">Delete</button>
        ` : ""}
      </div>
    </article>
  `).join("");

  $("emptyMessage").style.display =
    filtered.length ? "none" : "block";

  $("items").querySelectorAll("[data-edit]").forEach(btn => {
    btn.onclick = () => editItem(btn.dataset.edit);
  });

  $("items").querySelectorAll("[data-delete]").forEach(btn => {
    btn.onclick = () => deleteItem(btn.dataset.delete);
  });
}

$("search").addEventListener("input", renderItems);

renderItems();
</script>

</body>
</html>
