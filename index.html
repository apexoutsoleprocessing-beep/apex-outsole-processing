
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>apex-outsole-processing</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#123456;color:white;padding:20px;text-align:center}
header h1{font-size:25px;overflow-wrap:anywhere}
button{padding:11px 15px;border:0;border-radius:7px;cursor:pointer;font-weight:bold;margin:4px}
.primary{background:#0875cf;color:white}
.secondary{background:#dbeafe;color:#123456}
.delete{background:#dc2626;color:white}
main{max-width:1100px;margin:20px auto;padding:0 12px}
.panel{background:white;padding:18px;border-radius:12px;margin-bottom:20px}
.hidden{display:none!important}
label{display:block;margin:13px 0 6px;font-weight:bold}
input,textarea{width:100%;padding:12px;border:1px solid #ccd5df;border-radius:7px;font:inherit}
.preview{display:none;max-width:200px;max-height:180px;margin-top:10px;object-fit:contain}
.search{margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #00000012}
.card img{width:100%;height:210px;object-fit:contain;background:#e8edf3}
.card-body{padding:15px}
.card h2{overflow-wrap:anywhere}
.detail{padding:9px 0;border-top:1px solid #e5e7eb;overflow-wrap:anywhere;white-space:pre-wrap}
.detail b{display:block;font-size:12px;color:#64748b;margin-bottom:4px}
.status{padding:10px;background:#eaf2ff;border-radius:7px}
footer{text-align:center;padding:25px;color:#64748b}
</style>
</head>

<body>
<header>
  <h1>APEX OUTSOLE PROCESSING</h1>
  <button class="secondary" id="loginBtn">Admin Login</button>
  <button class="delete hidden" id="logoutBtn">Logout</button>
</header>

<main>
  <section id="loginPanel" class="panel hidden">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <label for="password">পাসওয়ার্ড</label>
      <input id="password" type="password" placeholder="Admin Password" required>
      <button class="primary" type="submit">Login</button>
      <button class="secondary" id="cancelLogin" type="button">Cancel</button>
      <p id="loginError"></p>
    </form>
  </section>

  <section id="adminPanel" class="panel hidden">
    <h2 id="formHeading">Add New Sole</h2>
    <form id="soleForm">
      <input type="hidden" id="editId">

      <label for="picture">PICTURE - Gallery থেকে ছবি বাছুন</label>
      <input type="file" id="picture" accept="image/*">
      <img id="preview" class="preview" alt="Picture preview">

      <label for="soleName">SOLE NAME</label>
      <input id="soleName" required placeholder="Enter sole name">

      <label for="colour">COLOUR</label>
      <input id="colour" placeholder="Enter colour">

      <label for="processing">SOLE PROCESSING</label>
      <input id="processing" placeholder="Enter sole processing">

      <label for="colourMix">COLOUR MIX (made)</label>
      <textarea id="colourMix" rows="3"></textarea>

      <button class="primary" id="saveBtn" type="submit">Save Item</button>
      <button class="secondary" id="clearBtn" type="button">Clear</button>
    </form>
  </section>

  <input class="search" id="search" placeholder="Search sole name or colour...">

  <p id="status" class="status">Firebase থেকে ডাটা লোড হচ্ছে...</p>
  <section id="items" class="grid"></section>

  <p id="emptyMessage" style="text-align:center;display:none">
    কোনো আইটেম নেই।
  </p>
</main>

<footer>© 2026 apex-outsole-processing</footer>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
  getDatabase, ref, push, set, update, remove, onValue
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXtsTR0gKRqDN8EEIdvHdkhMnUrmqfITg",
  authDomain: "apex-outsole-processiing.firebaseapp.com",
  databaseURL: "https://apex-outsole-processiing-default-rtdb.firebaseio.com",
  projectId: "apex-outsole-processiing",
  storageBucket: "apex-outsole-processiing.firebasestorage.app",
  messagingSenderId: "471957129756",
  appId: "1:471957129756:web:83094765801aa073256dd9",
  measurementId: "G-BRSPNGQPS8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const productsRef = ref(db, "products");

const ADMIN_PASSWORD = "@#$@#$@#$";
const $ = id => document.getElementById(id);

let isAdmin = false;
let currentImage = "";
let items = [];
let loading = true;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[ch]);
}

function setStatus(message) {
  $("status").textContent = message;
  $("status").style.display = "block";
}

$("loginBtn").onclick = () => {
  if (!isAdmin) {
    $("loginPanel").classList.remove("hidden");
  }
};

$("cancelLogin").onclick = () => {
  $("loginPanel").classList.add("hidden");
  $("loginError").textContent = "";
  $("password").value = "";
};

$("loginForm").onsubmit = event => {
  event.preventDefault();

  if ($("password").value === ADMIN_PASSWORD) {
    isAdmin = true;
    $("loginPanel").classList.add("hidden");
    $("adminPanel").classList.remove("hidden");
    $("loginBtn").classList.add("hidden");
    $("logoutBtn").classList.remove("hidden");
    $("password").value = "";
    $("loginError").textContent = "";
    renderItems();
  } else {
    $("loginError").textContent = "ভুল পাসওয়ার্ড!";
    $("password").value = "";
  }
};

$("logoutBtn").onclick = () => {
  isAdmin = false;
  $("adminPanel").classList.add("hidden");
  $("loginPanel").classList.add("hidden");
  $("loginBtn").classList.remove("hidden");
  $("logoutBtn").classList.add("hidden");
  resetForm();
  renderItems();
};

function resetForm() {
  $("soleForm").reset();
  $("editId").value = "";
  currentImage = "";
  $("preview").removeAttribute("src");
  $("preview").style.display = "none";
  $("formHeading").textContent = "Add New Sole";
  $("saveBtn").textContent = "Save Item";
}

$("clearBtn").onclick = resetForm;

$("picture").onchange = function() {
  const file = this.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("একটি ছবি নির্বাচন করুন।");
    this.value = "";
    return;
  }

  if (file.size > 12 * 1024 * 1024) {
    alert("১২ MB-এর চেয়ে ছোট ছবি নির্বাচন করুন।");
    this.value = "";
    return;
  }

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    try {
      const scale = Math.min(
        1, 700 / Math.max(img.width, img.height)
      );

      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));

      canvas.getContext("2d").drawImage(
        img, 0, 0, canvas.width, canvas.height
      );

      currentImage = canvas.toDataURL("image/jpeg", 0.65);
      $("preview").src = currentImage;
      $("preview").style.display = "block";
    } catch (error) {
      console.error(error);
      alert("ছবি প্রসেস করা যায়নি।");
    }

    URL.revokeObjectURL(url);
  };

  img.onerror = () => {
    URL.revokeObjectURL(url);
    alert("ছবিটি খোলা যায়নি।");
  };

  img.src = url;
};

$("soleForm").onsubmit = async event => {
  event.preventDefault();

  if (!isAdmin) {
    alert("প্রথমে Admin Login করুন।");
    return;
  }

  const id = $("editId").value;
  const oldItem = items.find(item => item.id === id);

  if (!oldItem && !currentImage) {
    alert("প্রথমে একটি ছবি নির্বাচন করুন।");
    return;
  }

  const item = {
    image: currentImage || oldItem?.image || "",
    name: $("soleName").value.trim(),
    colour: $("colour").value.trim(),
    processing: $("processing").value.trim(),
    mix: $("colourMix").value.trim(),
    updatedAt: Date.now()
  };

  $("saveBtn").disabled = true;

  try {
    if (id) {
      await update(ref(db, "products/" + id), item);
    } else {
      const newRef = push(productsRef);
      await set(newRef, {
        ...item,
        createdAt: Date.now()
      });
    }

    resetForm();
    setStatus("Firebase-এ ডাটা সেভ হয়েছে।");
    alert("সফলভাবে সেভ হয়েছে!");
  } catch (error) {
    console.error(error);
    alert("সেভ হয়নি। Firebase Realtime Database Rules পরীক্ষা করুন।");
  } finally {
    $("saveBtn").disabled = false;
  }
};

function editItem(id) {
  if (!isAdmin) return;

  const item = items.find(x => x.id === id);
  if (!item) return;

  $("editId").value = item.id;
  $("soleName").value = item.name || "";
  $("colour").value = item.colour || "";
  $("processing").value = item.processing || "";
  $("colourMix").value = item.mix || "";

  currentImage = item.image || "";

  if (currentImage) {
    $("preview").src = currentImage;
    $("preview").style.display = "block";
  } else {
    $("preview").removeAttribute("src");
    $("preview").style.display = "none";
  }

  $("formHeading").textContent = "Edit Sole";
  $("saveBtn").textContent = "Update Item";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteItem(id) {
  if (!isAdmin) return;

  const item = items.find(x => x.id === id);
  if (!item || !confirm("এই আইটেমটি মুছে ফেলবেন?")) return;

  try {
    await remove(ref(db, "products/" + id));
    setStatus("আইটেম মুছে ফেলা হয়েছে।");
  } catch (error) {
    console.error(error);
    alert("মুছে ফেলা যায়নি। Database Rules পরীক্ষা করুন।");
  }
}

function renderItems() {
  if (loading) return;

  const query = $("search").value.toLowerCase().trim();

  const filtered = items.filter(item =>
    [item.name, item.colour, item.processing, item.mix]
      .some(value =>
        String(value || "").toLowerCase().includes(query)
      )
  );

  $("items").innerHTML = filtered.map(item => `
    <article class="card">
      <img
        src="${escapeHTML(item.image)}"
        alt="${escapeHTML(item.name || "Sole")}"
        loading="lazy"
      >

      <div class="card-body">
        <h2>${escapeHTML(item.name || "Unnamed Sole")}</h2>

        <div class="detail">
          <b>COLOUR</b>${escapeHTML(item.colour || "—")}
        </div>

        <div class="detail">
          <b>SOLE PROCESSING</b>${escapeHTML(item.processing || "—")}
        </div>

        <div class="detail">
          <b>COLOUR MIX (made)</b>${escapeHTML(item.mix || "—")}
        </div>

        ${isAdmin ? `
          <button class="secondary" data-edit="${escapeHTML(item.id)}">Edit</button>
          <button class="delete" data-delete="${escapeHTML(item.id)}">Delete</button>
        ` : ""}
      </div>
    </article>
  `).join("");

  $("emptyMessage").style.display =
    filtered.length ? "none" : "block";

  $("emptyMessage").textContent = query
    ? "কোনো মিল পাওয়া যায়নি।"
    : "কোনো আইটেম নেই। Admin Login করে নতুন ছবি যোগ করুন।";

  $("items").querySelectorAll("[data-edit]").forEach(button => {
    button.onclick = () => editItem(button.dataset.edit);
  });

  $("items").querySelectorAll("[data-delete]").forEach(button => {
    button.onclick = () => deleteItem(button.dataset.delete);
  });
}

$("search").addEventListener("input", renderItems);

onValue(productsRef, snapshot => {
  const data = snapshot.val() || {};

  items = Object.entries(data)
    .filter(([, value]) => value && typeof value === "object")
    .map(([id, value]) => ({ ...value, id }));

  loading = false;
  $("status").style.display = "none";
  renderItems();
}, error => {
  console.error(error);
  loading = false;
  setStatus("ডাটা লোড হয়নি। Firebase Database Rules ও URL পরীক্ষা করুন।");
  renderItems();
});
</script>
</body>
</html>
